authentication:
  # Keep credentials outside version control. Configure a local API key through
  # your deployment mechanism if authenticated writes are required.
  # single_user_api_key: <set-locally>
  allow_anonymous_access: true
uvicorn:
  host: "0.0.0.0"
  port: 8000
allow_origins:
  - http://localhost:8000
  - http://localhost:5000
  - http://localhost:5001
  - http://localhost:5005
  - http://localhost:5053
  - http://piloader:5000
trees:
  - path: /
    tree: catalog
    args:
      uri: "catalog.db"
      writable_storage: "data/"
      init_if_not_exists: true
      specs: [{"name": "afl.event_catalog", "version": "0.1"}, {"name": "afl", "version": "0.1"}]
