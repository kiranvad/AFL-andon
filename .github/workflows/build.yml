name: Build Linux AppImage

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
        default: ''
      version:
        description: Version to apply for release packaging
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Apply release version
        if: inputs.version != ''
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - run: npm ci
        env:
          AFL_ANDON_BUILD_ONLY: '1'
      - run: npm run check-package
      - name: Install AppImage build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - name: Build AppImage
        run: npm run build:linux -- --publish=never
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
